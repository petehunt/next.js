[package]
name = "rust-rsc-prototype-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
next-rsc = { path = "../../crates/next-rsc", default-features = false, features = ["json"] }
next-rsc-flight = { path = "../../crates/next-rsc-flight" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
