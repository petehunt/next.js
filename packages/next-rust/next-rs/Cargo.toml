[package]
name = "next-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust runtime for first-class Rust in Next.js: islands, route handlers, and the boundary IDL."

[dependencies]
next-macros.workspace = true
base64.workspace = true
http.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
maud = { version = "0.27", optional = true }

[features]
default = ["maud"]
maud = ["dep:maud"]
store = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
