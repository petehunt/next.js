[package]
name = "next-rs-runtime-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The native next-rs HTTP server, so Rust-owned traffic bypasses Node"

[dependencies]
futures-util = { workspace = true }
http = "1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
next-rs = { workspace = true }
next-rs-adapter-api = { workspace = true }
next-rs-core = { workspace = true }
next-rs-http = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "io-util"] }

[dev-dependencies]
next-rs-router = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "net",
  "rt",
  "rt-multi-thread",
  "io-util",
  "macros",
  "time",
] }

[lints]
workspace = true
