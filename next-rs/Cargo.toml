[workspace]
resolver = "2"
members = ["crates/*", "examples/blog-rs", "examples/blog-rs/exports"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/petehunt/next.js"
description = "next-rs: a progressive Rust runtime for Next.js"

[workspace.dependencies]
next-rs = { path = "crates/next-rs", version = "0.1.0" }
next-rs-adapter-api = { path = "crates/next-rs-adapter-api", version = "0.1.0" }
next-rs-core = { path = "crates/next-rs-core", version = "0.1.0" }
next-rs-crypto = { path = "crates/next-rs-crypto", version = "0.1.0" }
next-rs-html = { path = "crates/next-rs-html", version = "0.1.0" }
next-rs-http = { path = "crates/next-rs-http", version = "0.1.0" }
next-rs-macros = { path = "crates/next-rs-macros", version = "0.1.0" }
next-rs-react = { path = "crates/next-rs-react", version = "0.1.0" }
next-rs-react-renderer = { path = "crates/next-rs-react-renderer", version = "0.1.0" }
next-rs-router = { path = "crates/next-rs-router", version = "0.1.0" }

base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
futures-util = { version = "0.3", default-features = false, features = [
  "std",
  "alloc",
] }
form_urlencoded = "1"
percent-encoding = "2"
proc-macro2 = "1"
quote = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[workspace.lints.clippy]
too_many_arguments = "allow"
