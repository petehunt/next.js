[package]
name = "next-rs-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mount Axum routers and handlers inside a next-rs route.rs"

[dependencies]
axum = { version = "0.7", default-features = false }
futures-util = { workspace = true }
next-rs-adapter-api = { workspace = true }
next-rs-core = { workspace = true }
next-rs-http = { workspace = true }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
axum = { version = "0.7", default-features = false, features = ["json"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }

[lints]
workspace = true
