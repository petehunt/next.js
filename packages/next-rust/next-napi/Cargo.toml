[package]
name = "next-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "N-API surface exposing next-rs islands and route handlers to Node."

[dependencies]
next-rs = { version = "0.1.0", path = "../next-rs" }
futures = "0.3"
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
napi-build = "2"
